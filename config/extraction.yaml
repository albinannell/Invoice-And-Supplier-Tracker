# Rule-based extraction config.
#
# labels: regexes matched against a whole text segment (case-insensitive,
#         optional trailing ':' allowed). Earlier entries win.
# suppliers: known suppliers. Any alias / email domain / tax id found in the
#            document identifies the supplier. `date_order` resolves
#            ambiguous dates like 05/04/2026 (dmy = 5 April, mdy = May 4).
#            `currency` is only a fallback when the document doesn't say.

labels:
  invoice_number:
    - 'invoice (no\.?|number|nr\.?|#)'
    - 'inv\.? ?(#|no\.?)'
    - 'fakturanummer'
    - 'faktura ?nr\.?'
    - 'rechnungs?(nummer|[- ]nr\.?)'
  invoice_date:
    - 'invoice date'
    - 'issue date'
    - 'fakturadatum'
    - 'rechnungsdatum'
    - 'date'
    - 'datum'
  po_number:
    - 'po ?(number|no\.?|#|ref\.?)?'
    - 'customer po'
    - 'purchase order( no\.?| number)?'
    - '(er referens|your ref(erence)?\.?|ordernr|bestellnummer) ?/ ?po'
    - 'ordernr'
    - 'bestellnummer'
  total_amount:
    - 'total (due|amount|to pay)'
    - 'amount due'
    - 'grand total'
    - 'balance due'
    - 'att betala'
    - 'summa att betala'
    - 'gesamtbetrag'
    - 'total'
  line_items_header:
    - 'description'
    - 'beskrivning'
    - 'beschreibung'
    - 'item'
  line_items_end:
    - 'subtotal'
    - 'sub-total'
    - 'summa exkl\.? moms'
    - 'netto(betrag)?'

